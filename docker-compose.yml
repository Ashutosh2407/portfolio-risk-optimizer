version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: portfolio_db
    environment:
      POSTGRES_DB: portfolio_data
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./src/data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: portfolio_api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: portfolio_dashboard
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
    
volumes:
  timescale_data: